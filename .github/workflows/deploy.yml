name: Build & Deploy (Docker → GHCR → VPS)

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # owner/repo

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # needed to push to GHCR

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # GHCR requires a fully lowercase image name.
      - name: Compute image name
        id: img
        run: echo "image=${REGISTRY,,}/${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---- Build the image and push it to the registry --------------------
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.img.outputs.image }}:latest
            ${{ steps.img.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- Prepare SSH access to the server -------------------------------
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Fail fast with a clear message if the key isn't a valid private key.
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            echo "::error::VPS_SSH_KEY is not a valid/unencrypted private key. Re-set it with: gh secret set VPS_SSH_KEY < /path/to/private_key"
            exit 1
          fi
          ssh-keyscan -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # ---- Ship the compose file to the server ----------------------------
      # All runtime config lives in ~/graduation-project/.env ON THE SERVER
      # (you manage it there, not in GitHub). We only sync the compose file.
      - name: Copy compose file to server
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.VPS_PORT }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "mkdir -p ~/graduation-project/uploads"
          scp -i ~/.ssh/deploy_key -P "${{ secrets.VPS_PORT }}" \
            docker-compose.yml \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:graduation-project/docker-compose.yml"

      # ---- Deploy via docker compose --------------------------------------
      # The GHCR token is piped over stdin so it never appears in the process
      # list. `docker compose pull` needs it to fetch the private app image.
      - name: Deploy on server (compose pull & up)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key -p "${{ secrets.VPS_PORT }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "docker login '${{ env.REGISTRY }}' -u '${{ github.actor }}' --password-stdin \
             && cd ~/graduation-project \
             && docker compose pull \
             && docker compose up -d --remove-orphans \
             && docker image prune -f \
             && docker logout '${{ env.REGISTRY }}' \
             && docker compose ps"
